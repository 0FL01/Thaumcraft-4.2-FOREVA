import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
ext.advertisedModVersion = "6.1.BETA26"
group = "thaumcraft"
archivesBaseName = "Thaumcraft"

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"

    replace '@VERSION@', project.ext.advertisedModVersion
    replaceIn 'Thaumcraft.java'
}

repositories {
    maven {
        name = "curse"
        url = "https://www.cursemaven.com"
    }
}

dependencies {
    compile 'curse.maven:baubles-227083:2518667'
    testCompile 'junit:junit:4.12'
}

// ResearchItem's TC4 fluent setters and TC6 ResearchEntry's void setters have
// identical Java signatures but distinct JVM return descriptors. Java source
// cannot declare both, so add the two TC6 descriptors after compilation.
compileJava.inputs.property 'tc6ResearchEntryVoidSetters', 1
compileJava.doLast {
    File classFile = file("${compileJava.destinationDir}/thaumcraft/api/research/ResearchEntry.class")
    ClassReader reader = new ClassReader(classFile.bytes)
    ClassWriter writer = new ClassWriter(reader, 0)
    Set<String> methods = [] as Set
    ClassVisitor visitor = new ClassVisitor(Opcodes.ASM5, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor,
                                  String signature, String[] exceptions) {
            methods.add(name + descriptor)
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            addVoidSetter('setParents', 'parents')
            addVoidSetter('setSiblings', 'siblings')
            super.visitEnd()
        }

        private void addVoidSetter(String methodName, String fieldName) {
            String descriptor = '([Ljava/lang/String;)V'
            if (methods.contains(methodName + descriptor)) {
                return
            }
            MethodVisitor method = cv.visitMethod(Opcodes.ACC_PUBLIC, methodName,
                    descriptor, null, null)
            method.visitCode()
            method.visitVarInsn(Opcodes.ALOAD, 0)
            method.visitVarInsn(Opcodes.ALOAD, 1)
            method.visitFieldInsn(Opcodes.PUTFIELD,
                    'thaumcraft/api/research/ResearchEntry', fieldName,
                    '[Ljava/lang/String;')
            method.visitInsn(Opcodes.RETURN)
            method.visitMaxs(2, 2)
            method.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    classFile.bytes = writer.toByteArray()
}

processResources {
    inputs.property 'advertisedModVersion', project.ext.advertisedModVersion

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.ext.advertisedModVersion
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    from(sourceSets.main.resources.srcDirs) {
        include 'assets/thaumcraft/lang/en_us.lang'
        rename { fileName -> fileName == 'en_us.lang' ? 'en_US.lang' : fileName }
    }
}

jar {
    classifier = 'universal'
    from sourceSets.main.output
}

// API jar: packages thaumcraft.api.* for addon mods
task apiJar(type: Jar) {
    classifier = 'api'
    from(sourceSets.main.output) {
        include 'thaumcraft/api/**'
    }
}

// Dev jar: all classes + sources for IDE debugging
task devJar(type: Jar) {
    classifier = 'dev'
    from sourceSets.main.output
    from sourceSets.main.allJava
}

artifacts {
    archives apiJar
    archives devJar
}

// Re-obfuscation: production main jar only. Keep API/dev jars readable.
reobf {
    jar { }
}

// CI test configuration: exclude client-only tests when running in CI
// (client tests require display/GL context unavailable in headless CI)
test {
    if (System.getenv('CI') == 'true' || project.hasProperty('ci')) {
        exclude 'thaumcraft/client/**'
    }
}

idea { module { inheritOutputDirs = true } }
