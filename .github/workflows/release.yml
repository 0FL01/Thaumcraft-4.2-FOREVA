# =============================================================================
# Release — triggered by push to master
# Runs tests and server smoke, then publishes one production universal jar.
# =============================================================================
name: Release

on:
  push:
    branches:
      - 'master'

concurrency:
  group: release-master
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG_DATE="$(date +%Y%m%d)"
          TAG_NAME="release-${TAG_DATE}-${SHORT_SHA}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          PREVIOUS_TAG="$(git describe --tags --match 'release-*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          BASE_REF=""

          if [[ -n "$PREVIOUS_TAG" ]]; then
            BASE_REF="$PREVIOUS_TAG"
            RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$ZERO_SHA" ]] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE_REF="$BEFORE_SHA"
            RANGE="${BEFORE_SHA}..${GITHUB_SHA}"
          else
            RANGE="$GITHUB_SHA"
          fi

          COMMIT_COUNT="$(git rev-list --count "$RANGE")"

          {
            echo "## Thaumcraft 4.2 1.12.2"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "**Предыдущий релиз:** \`${PREVIOUS_TAG}\`"
            elif [[ -n "$BASE_REF" ]]; then
              echo "**Предыдущий коммит:** \`${BASE_REF:0:7}\`"
            else
              echo "**Диапазон:** с начала истории"
            fi
            echo
            echo "**Новых коммитов:** ${COMMIT_COUNT}"
            echo
            echo "### Изменения"
            echo
            git log --reverse \
              --format="- [\`%h\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H) %s" \
              "$RANGE"
            echo
            if [[ -n "$BASE_REF" ]]; then
              echo "[Полный список изменений](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${GITHUB_SHA})"
              echo
            fi
            echo "### Artifacts"
            echo "- Thaumcraft-1.0.0-universal.jar"
            echo
            echo "---"
          } > release-notes.md

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: thaumcraft-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: .gradle_home
          key: gradle-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Run tests (non-client)
        run: |
          docker run --rm \
            -v "$PWD:/workspace/thaumcraft" \
            -e GRADLE_USER_HOME=/workspace/thaumcraft/.gradle_home \
            --user "$(id -u):$(id -g)" \
            --entrypoint ./gradlew \
            thaumcraft-dev \
            clean test --console=plain -Pci=true

      - name: Server smoke test
        run: |
          set +e
          mkdir -p run
          SMOKE_LOG="$PWD/run/smoke-ci.log"
          LATEST_LOG="$PWD/run/logs/latest.log"
          TIMEOUT_SEC=240
          STARTED_AT="$(date +%s)"

          # Write eula
          printf 'eula=true\n' > run/eula.txt

          # Start server in background
          docker run --rm --name thaumcraft-smoke-ci \
            -v "$PWD:/workspace/thaumcraft" \
            -e GRADLE_USER_HOME=/workspace/thaumcraft/.gradle_home \
            --user "$(id -u):$(id -g)" \
            --entrypoint ./gradlew \
            thaumcraft-dev \
            runServer -x getAssets --no-daemon --console=plain \
            < /dev/null > "$SMOKE_LOG" 2>&1 &
          SERVER_PID=$!

          echo "Server PID: ${SERVER_PID}, timeout: ${TIMEOUT_SEC}s"

          # Monitor for ready state or crash
          READY=0
          TIMED_OUT=0
          while true; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server process exited"
              break
            fi

            # Check for "Done (" in stdout log
            if grep -Fq 'Done (' "$SMOKE_LOG" 2>/dev/null; then
              READY=1
              echo "Server reached ready state (from stdout)"
              break
            fi

            # Check for "Done (" in latest.log
            if [[ -f "$LATEST_LOG" ]] && grep -Fq 'Done (' "$LATEST_LOG" 2>/dev/null; then
              READY=1
              echo "Server reached ready state (from latest.log)"
              break
            fi

            # Check crash markers
            CRASH_MARKERS=$(grep -nE 'LoaderException|LoaderExceptionModCrash|Game crashed|Caught exception|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|ExceptionInInitializerError|Repair material has already been set|Encountered an unexpected exception|FATAL|fatal' "$SMOKE_LOG" 2>/dev/null || true)
            if [[ -n "$CRASH_MARKERS" ]]; then
              echo "Crash markers detected in smoke log:"
              echo "$CRASH_MARKERS"
              break
            fi

            # Check crash reports
            if [[ -d "$PWD/run/crash-reports" ]]; then
              CRASH_COUNT=$(find "$PWD/run/crash-reports" -type f 2>/dev/null | wc -l)
              if [[ "$CRASH_COUNT" -gt 0 ]]; then
                echo "Crash reports found: $CRASH_COUNT"
                ls -la "$PWD/run/crash-reports/"
                break
              fi
            fi

            # Timeout check
            NOW="$(date +%s)"
            ELAPSED=$(( NOW - STARTED_AT ))
            if [[ "$ELAPSED" -ge "$TIMEOUT_SEC" ]]; then
              TIMED_OUT=1
              echo "Timed out after ${TIMEOUT_SEC}s"
              break
            fi

            sleep 2
          done

          # Kill server container
          docker stop -t 5 thaumcraft-smoke-ci 2>/dev/null || docker kill thaumcraft-smoke-ci 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

          # Final verdict
          if [[ "$READY" -eq 1 ]]; then
            echo ""
            echo "=========================================="
            echo "Server smoke test: PASSED"
            echo "=========================================="
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "Server smoke test: FAILED"
          echo "=========================================="
          if [[ "$TIMED_OUT" -eq 1 ]]; then
            echo "Reason: timed out (${TIMEOUT_SEC}s)"
          else
            echo "Reason: server did not reach ready state"
          fi
          echo ""
          echo "--- smoke log (last 50 lines) ---"
          tail -50 "$SMOKE_LOG"
          echo ""
          if [[ -f "$LATEST_LOG" ]]; then
            echo "--- latest.log (last 30 lines) ---"
            tail -30 "$LATEST_LOG"
          fi
          exit 1
        shell: bash
        timeout-minutes: 6

      - name: Build universal JAR
        run: |
          docker run --rm \
            -v "$PWD:/workspace/thaumcraft" \
            -e GRADLE_USER_HOME=/workspace/thaumcraft/.gradle_home \
            --user "$(id -u):$(id -g)" \
            --entrypoint ./gradlew \
            thaumcraft-dev \
            clean jar reobfJar --console=plain -Pci=true

      - name: Verify universal JAR reobfuscation
        run: ./scripts/dev.sh check-jar build/libs/Thaumcraft-1.0.0-universal.jar

      - name: List release artifact
        run: ls -lh build/libs/Thaumcraft-*-universal.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Thaumcraft 4.2 1.12.2 — ${{ steps.meta.outputs.short_sha }}
          body_path: release-notes.md
          files: build/libs/Thaumcraft-*-universal.jar
          prerelease: false
          make_latest: true
